repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ⭐️ uv 가상환경에 설치된 pyright를 직접 호출하는 설정
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

  # 아래는 로컬 pyright이 오류가 없어서 주석으로 남긴 원격 pyright 검사입니다.
  # - repo: https://github.com/RobertCraigie/pyright-python
  #   rev: v1.1.411
  #   hooks:
  #     - id: pyright
