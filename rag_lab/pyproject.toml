[project]
name = "rag-lab"
version = "0.1.0"
description = "RAG 실험 환경 (LangGraph + pgvector)"
requires-python = "==3.11.*"
dependencies = [
    "asyncpg>=0.30.0",
    "langgraph>=1.0.6",
    "openai>=2.6.0",
    "pgvector>=0.4.2",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.44",
]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: 실제 Neon DB 연결이 필요한 테스트 (DATABASE_URL 없으면 skip)",
    "llm: 실제 OpenAI API 호출이 필요한 테스트 (기본 skip)",
]
