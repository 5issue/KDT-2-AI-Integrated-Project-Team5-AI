# serving 이미지 자동 빌드·ECR 배포
# CI(검사)가 main에서 성공한 뒤에만 실행 → 검사 통과한 코드만 이미지로 만든다.
# amd64 + arm64 멀티 아키텍처로 빌드 (EKS 노드가 amd64·arm64 혼합)
name: CD - serving

on:
  workflow_run:
    workflows: ["CI"]          # ci.yaml 의 name
    types: [completed]
    branches: [main]
  workflow_dispatch:           # Actions 화면에서 수동 실행 가능

permissions:
  contents: read

jobs:
  build-and-push:
    # 수동 실행이거나, CI가 성공했을 때만 진행
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # CI가 검사한 바로 그 커밋으로 빌드 (수동 실행이면 현재 커밋)
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ARM64 빌드 지원용 에뮬레이터
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 멀티 아키텍처 빌드 도구
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 빌드 컨텍스트는 레포 루트 (serving 가이드 1절)
      - name: 이미지 빌드·push (멀티 아키텍처)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: serving/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/kurly-ai-assistant:${{ env.COMMIT_SHA }}
            ${{ steps.ecr-login.outputs.registry }}/kurly-ai-assistant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
