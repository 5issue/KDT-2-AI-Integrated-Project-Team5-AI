# serving 이미지 자동 빌드·ECR 배포
# CI(검사)가 main에서 성공한 뒤에만 실행 → 검사 통과한 코드만 이미지로 만든다.
# amd64 + arm64 멀티 아키텍처로 빌드 (EKS 노드가 amd64·arm64 혼합)
name: CD - serving

on:
  workflow_run:
    workflows: ["CI"]          # ci.yaml 의 name
    types: [completed]
    branches: [main]
  workflow_dispatch:           # Actions 화면에서 수동 실행 가능

permissions:
  contents: read

jobs:
  build-and-push:
    # 수동 실행이거나, CI가 성공했을 때만 진행
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # CI가 검사한 바로 그 커밋으로 빌드 (수동 실행이면 현재 커밋)
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ARM64 빌드 지원용 에뮬레이터
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 멀티 아키텍처 빌드 도구
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 빌드 컨텍스트는 레포 루트 (serving 가이드 1절)
      - name: 이미지 빌드·push (멀티 아키텍처)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: serving/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/kurly-ai-assistant:${{ env.COMMIT_SHA }}
            ${{ steps.ecr-login.outputs.registry }}/kurly-ai-assistant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 자동 배포: total-k8s 의 AI 이미지 태그를 이번 커밋 번호로 바꿔 커밋 ──
      # → ArgoCD가 변경을 감지해 새 이미지로 자동 배포 (재시작 불필요)
      - name: total-k8s 이미지 태그 갱신
        env:
          GH_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}                  # total-k8s 쓰기용 토큰
          VALUES_FILE: charts/ai-service/values.yaml               # AI 차트 배포 설정 파일
          TAG: ${{ env.COMMIT_SHA }}                               # 위에서 이미지에 붙인 커밋 번호와 동일
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/5issue/total-k8s.git" k8s
          cd k8s
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # image: 블록 안의 tag 줄만 고침 (파일의 다른 tag·주석은 건드리지 않음)
          set_tag() {
            sed -i -E "/^image:/,/^[^ #]/ s|^  tag:.*|  tag: \"${TAG}\"|" "$VALUES_FILE"
          }
          # 백엔드 CD와 동시에 push해 "충돌"할 때만 재시도 (권한 오류는 바로 실패)
          for i in 1 2 3 4 5; do
            set_tag
            git add "$VALUES_FILE"
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -q -m "chore(ai): 이미지 태그 ${TAG:0:7} 로 갱신"
            if out=$(git push origin main 2>&1); then echo "갱신 완료"; exit 0; fi
            echo "$out"
            if echo "$out" | grep -qE "403|denied|Authentication"; then echo "권한 오류 → 토큰 확인"; exit 1; fi
            echo "push 충돌 → 최신 main 받아서 재시도 ($i)"
            git fetch -q origin main && git reset -q --hard origin/main
            sleep $((i * 3))
          done
          echo "5번 모두 실패"; exit 1
