name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 수동 실행은 바뀐 파일과 관계없이 DB 테스트를 전부 돌립니다.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen --python 3.11 --all-packages --all-groups
      - name: Check lockfile
        run: uv lock --check
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright regression check
        run: uv run pyright

      - name: Pytest 단위 (DB 없음, 전부)
        # DB 가 필요 없는 테스트는 항상 전부 돕니다. 로컬 기준 15초 안팎입니다.
        # 레포 루트에서 인자 없이 돌려야 루트 conftest.py(환경변수 격리)가 로드됩니다.
        run: uv run pytest -q -m "not db"

      - name: DB 테스트 대상 고르기 (바뀐 패키지만)
        id: select
        # DB 테스트를 전부 돌리면 러너와 Neon 사이 왕복 지연 때문에 20분을 넘깁니다. 바뀐 패키지와 그것을
        # 쓰는 쪽만 고릅니다(recsys_sql·rag_lab 이 바뀌면 serving 도). 마이그레이션·루트 설정·CI 가 바뀌면
        # 전부 돌립니다. 규칙은 .github/scripts/select_db_tests.py 에 있습니다.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) dirs=$(python3 .github/scripts/select_db_tests.py --base "origin/$BASE_REF") ;;
            push) dirs=$(python3 .github/scripts/select_db_tests.py --base "$BEFORE") ;;
            *) dirs=$(python3 .github/scripts/select_db_tests.py --all) ;;
          esac
          echo "DB 테스트 대상: ${dirs:-(없음)}"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - name: Pytest DB 통합 (고른 패키지, 전부 롤백)
        if: steps.select.outputs.dirs != ''
        # - 모든 DB 테스트는 테스트마다 트랜잭션을 열고 롤백합니다. 세션이 끝나면 루트 conftest.py 가
        #   테스트 전용 ID 대역·표식에 남은 행을 세고, 1행이라도 있으면 실패시킵니다.
        # - 경로를 넘기면 pytest 가 그 패키지의 pyproject 를 설정으로 잡아 루트 conftest.py 를 건너뜁니다.
        #   --rootdir=. -c pyproject.toml 로 레포 루트를 기준으로 고정합니다.
        # - llm 마커(실제 OpenRouter 호출, 과금)는 `--run-llm` 을 줄 때만 돕니다. 여기서는 돌지 않습니다.
        # - secret 이 비면 DB 테스트가 조용히 skip 되어 회귀를 못 잡으므로 먼저 멈춥니다.
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.CI_DATABASE_URL_DIRECT }}
          DIRS: ${{ steps.select.outputs.dirs }}
        timeout-minutes: 40
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error::CI_DATABASE_URL / CI_DATABASE_URL_DIRECT secret 이 없습니다. DB 테스트가 skip 되어 회귀를 잡지 못합니다."
            exit 1
          fi
          # shellcheck disable=SC2086  # 폴더 목록을 인자 여러 개로 펼칩니다.
          uv run pytest --rootdir=. -c pyproject.toml -m db -q -rs $DIRS

  docker-check:
    name: Docker checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build serving image
        run: docker build --file serving/Dockerfile --tag serving-ci .
      - name: Verify serving app import
        run: docker run --rm --entrypoint /app/.venv/bin/python serving-ci -c "from serving.app import app; assert app"
