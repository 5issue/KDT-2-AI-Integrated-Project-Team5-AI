name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen --python 3.11 --all-packages --all-groups
      - name: Check lockfile
        run: uv lock --check
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright regression check
        run: uv run pyright

      - name: Pytest (DB 없이 도는 테스트만)
        # DATABASE_URL 을 주지 않으므로 @pytest.mark.db 테스트는 자동으로 skip 됩니다.
        # Neon 브랜치를 CI 에 붙이려면 secrets 에 DATABASE_URL 을 넣고 env 로 내려주세요.
        run: uv run pytest -q

      - name: 휠에 SQL 카탈로그가 담기는지 확인
        # serving 이 recsys_sql 카탈로그를 import 하는데, queries/ 는 패키지 밖에 있습니다.
        # force-include 설정이 빠지면 휠에 .sql 이 한 장도 안 들어가고, 개발 중에는
        # editable 설치라 드러나지 않다가 이미지 첫 요청에서 죽습니다.
        run: ./scripts/verify_wheel_catalog.sh

