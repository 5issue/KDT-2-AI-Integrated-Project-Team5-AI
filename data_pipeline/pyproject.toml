[project]
name = "data-pipeline"
version = "0.1.0"
description = "raw data -> OpenAI Batch API 파싱 -> Neon PostgreSQL bulk insert"
requires-python = "==3.11.*"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "openai>=2.6.0",
    "pgvector>=0.4.2",
    "pyarrow>=18.0.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.44",
]

[project.scripts]
data-pipeline = "data_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: 실제 Neon DB 연결이 필요한 테스트 (DATABASE_URL 없으면 skip)",
    "llm: 실제 OpenAI API 호출이 필요한 테스트 (기본 skip)",
]
