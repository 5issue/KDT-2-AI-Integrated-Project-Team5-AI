[project]
name = "kdt-2-ai-integrated-project-team5-ai"
version = "0.1.0"
description = "Team AI Project"
requires-python = "==3.11.*"
dependencies = []

[tool.uv.workspace]
members = ["data_pipeline", "rag_lab", "recsys_sql", "serving"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle 오류, F: Pyflakes, I: isort, N: Naming, W: Warning
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["data_pipeline", "rag_lab", "recsys_sql", "serving"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# 레포 루트에 멤버와 같은 이름의 디렉터리가 있어 네임스페이스 패키지로 잡힙니다.
# src 를 sys.path 앞에 두어 실제 패키지가 먼저 잡히게 합니다.
pythonpath = ["data_pipeline/src", "rag_lab/src", "recsys_sql/src", "serving/src"]
testpaths = ["data_pipeline/tests", "rag_lab/tests", "recsys_sql/tests", "serving/tests"]
asyncio_mode = "auto"
markers = [
    "db: 실제 Neon DB 연결이 필요한 테스트 (DATABASE_URL 없으면 skip)",
    "llm: 실제 OpenAI API 호출이 필요한 테스트 (기본 skip)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["data_pipeline", "rag_lab", "recsys_sql", "serving"]
exclude = ["**/.*", "**/.venv", "**/__pycache__", "**/node_modules"]
# pytest 의 pythonpath 와 같은 이유로 src 를 명시합니다.
extraPaths = ["data_pipeline/src", "rag_lab/src", "recsys_sql/src", "serving/src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "alembic>=1.19.2",
    "pre-commit>=4.6.2",
    "psycopg[binary]>=3.3.5",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    # pre-commit 훅(.pre-commit-config.yaml 의 ruff-pre-commit rev)과 같은 버전으로 고정합니다.
    "ruff==0.16.8",
]
